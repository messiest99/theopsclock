<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpsClock</title>
<style>
  body {
    margin: 0;
    font-family: monospace; /* original font restored */
    background-color: #000;
    color: #f00;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  #clock-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 20px;
    gap: 10px;
  }

  .clock {
    border: 1px dashed #f00;
    padding: 10px 20px;
    text-align: center;
    position: relative;
    min-width: 100px;
  }

  .clock .label {
    font-size: 16px;
    margin-bottom: 5px;
  }

  .clock .time {
    font-size: 24px;
  }

  .remove-btn {
    position: absolute;
    top: 2px;
    right: 2px;
    background: #000;
    color: #f00;
    border: 1px solid #f00;
    cursor: pointer;
    font-size: 14px;
    padding: 0 5px;
  }

  /* Add Zone Panel */
  .add-zone-panel {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .add-zone-panel select,
  .add-zone-panel button {
    background-color: #000;
    color: #f00;
    border: 1px solid #f00;
    padding: 5px 10px;
    font-family: monospace;
    cursor: pointer;
  }

  .add-zone-panel select {
    min-width: 150px;
  }

  /* Converter Panel */
  .converter {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .converter input,
  .converter select,
  .converter button {
    background-color: #000;
    color: #f00;
    border: 1px solid #f00;
    padding: 5px 10px;
    font-family: monospace;
    font-size: 16px;
  }

  #converter-results {
    margin-top: 10px;
  }

</style>
</head>
<body>

<h1>OpsClock</h1>

<div id="clock-container"></div>

<!-- Add Time Zone panel back above converter -->
<div class="add-zone-panel">
  <select id="timezone-select">
    <option value="UTC">Zulu</option>
    <option value="America/Los_Angeles">PST</option>
    <option value="America/Denver">MST</option>
    <option value="America/Chicago">CT</option>
    <option value="America/New_York">EST</option>
    <option value="Europe/London">London</option>
    <option value="Asia/Tokyo">Tokyo</option>
    <option value="Australia/Sydney">Sydney</option>
  </select>
  <button id="add-zone">Add</button>
</div>

<!-- Time Converter -->
<div class="converter">
  <h2>Time Converter</h2>
  <input type="text" id="converter-input" placeholder="e.g., 14:00 or 2:30 PM" />
  <select id="converter-zone">
    <option value="UTC">Zulu (UTC)</option>
    <option value="America/Los_Angeles">PST</option>
    <option value="America/Denver">MST</option>
    <option value="America/Chicago">CT</option>
    <option value="America/New_York">EST</option>
    <option value="Europe/London">London</option>
    <option value="Asia/Tokyo">Tokyo</option>
    <option value="Australia/Sydney">Sydney</option>
  </select>
  <button id="convert-btn">Convert</button>
  <div id="converter-results"></div>
</div>

<script>
  const defaultZones = [
    { label: "Zulu", tz: "UTC" },
    { label: "PST", tz: "America/Los_Angeles" },
    { label: "MST", tz: "America/Denver" },
    { label: "CT", tz: "America/Chicago" },
    { label: "EST", tz: "America/New_York" },
    { label: "London", tz: "Europe/London" }
  ];

  let userZones = JSON.parse(localStorage.getItem("opsclock-zones")) || defaultZones;

  const container = document.getElementById("clock-container");
  const timezoneSelect = document.getElementById("timezone-select");
  const addBtn = document.getElementById("add-zone");
  const convertInput = document.getElementById("converter-input");
  const convertZoneSelect = document.getElementById("converter-zone");
  const convertBtn = document.getElementById("convert-btn");
  const convertResults = document.getElementById("converter-results");

  function saveZones() {
    localStorage.setItem("opsclock-zones", JSON.stringify(userZones));
  }

  function renderClocks() {
    container.innerHTML = "";
    userZones.forEach((zone, index) => {
      const clockDiv = document.createElement("div");
      clockDiv.classList.add("clock");

      const label = document.createElement("div");
      label.classList.add("label");
      label.textContent = zone.label;

      const time = document.createElement("div");
      time.classList.add("time");
      time.id = `clock-${index}`;

      const removeBtn = document.createElement("button");
      removeBtn.textContent = "×";
      removeBtn.classList.add("remove-btn");
      removeBtn.addEventListener("click", () => {
        userZones.splice(index, 1);
        saveZones();
        renderClocks();
      });

      clockDiv.appendChild(removeBtn);
      clockDiv.appendChild(label);
      clockDiv.appendChild(time);
      container.appendChild(clockDiv);
    });
  }

  function updateClocks() {
    const now = new Date();
    userZones.forEach((zone, index) => {
      const t = now.toLocaleTimeString("en-US", { timeZone: zone.tz, hour12: false });
      document.getElementById(`clock-${index}`).textContent = t;
    });
  }

  addBtn.addEventListener("click", () => {
    const selectedTz = timezoneSelect.value;
    const selectedLabel = timezoneSelect.options[timezoneSelect.selectedIndex].text;
    if (!userZones.some(z => z.tz === selectedTz)) {
      userZones.push({ label: selectedLabel, tz: selectedTz });
      saveZones();
      renderClocks();
    }
  });

  // Simple Converter (works in user's local time now)
  convertBtn.addEventListener("click", () => {
    const inputTime = convertInput.value.trim();
    const inputZone = convertZoneSelect.value;

    const match = inputTime.match(/^(\d{1,2}):(\d{2})\s*(AM|PM|am|pm)?$/);
    if (!match) {
      convertResults.innerHTML = "Invalid format. Use HH:MM or HH:MM AM/PM";
      return;
    }

    let [, hours, minutes, ampm] = match;
    hours = parseInt(hours);
    minutes = parseInt(minutes);

    if (ampm) {
      ampm = ampm.toUpperCase();
      if (ampm === "PM" && hours < 12) hours += 12;
      if (ampm === "AM" && hours === 12) hours = 0;
    }

    const now = new Date();
    const date = new Date(Date.UTC(
      now.getUTCFullYear(),
      now.getUTCMonth(),
      now.getUTCDate(),
      hours,
      minutes,
      0
    ));

    let resultsHtml = "";
    userZones.forEach(zone => {
      const t = date.toLocaleTimeString("en-US", { timeZone: zone.tz, hour12: false });
      resultsHtml += `<div>${zone.label}: ${t}</div>`;
    });

    convertResults.innerHTML = resultsHtml;
  });

  renderClocks();
  updateClocks();
  setInterval(updateClocks, 1000);
</script>

</body>
</html>
