<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpsClock</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Add Time Zone Settings -->
  <div class="settings">
    <label for="timezone-select">Add Time Zone:</label>
    <select id="timezone-select">
      <option value="UTC">Zulu (UTC)</option>
      <option value="America/Los_Angeles">PST</option>
      <option value="America/Denver">MST</option>
      <option value="America/Chicago">CT</option>
      <option value="America/New_York">EST</option>
      <option value="Europe/London">London</option>
      <option value="Asia/Tokyo">Tokyo</option>
      <option value="Australia/Sydney">Sydney</option>
    </select>
    <button id="add-zone">Add</button>
  </div>

  <!-- Clock Container -->
  <div class="container" id="clock-container">
    <!-- Clocks populate dynamically -->
  </div>

  <!-- Time Converter -->
  <div class="converter">
    <h2>Time Converter</h2>
    <input type="text" id="converter-input" placeholder="Type time zone e.g. MST 5:30 PM" list="tz-list" />
    <datalist id="tz-list">
      <option value="Zulu">
      <option value="UTC">
      <option value="PST">
      <option value="MST">
      <option value="CT">
      <option value="EST">
      <option value="London">
      <option value="Tokyo">
      <option value="Sydney">
    </datalist>
    <button id="convert-btn">Convert</button>
    <div id="converter-results"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
