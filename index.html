<!-- Time Converter -->
<div class="converter">
  <h2>Time Converter</h2>
  <input type="text" id="converter-input" placeholder="e.g., 17:00 or 5:30 PM" />
  
  <!-- Dropdown for input time zone -->
  <select id="converter-zone">
    <option value="UTC">Zulu (UTC)</option>
    <option value="America/Los_Angeles">PST</option>
    <option value="America/Denver">MST</option>
    <option value="America/Chicago">CT</option>
    <option value="America/New_York">EST</option>
    <option value="Europe/London">London</option>
    <option value="Asia/Tokyo">Tokyo</option>
    <option value="Australia/Sydney">Sydney</option>
  </select>

  <button id="convert-btn">Convert</button>
  <div id="converter-results"></div>
</div>
