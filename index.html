<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpsClock</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="clock" data-timezone="UTC">
      <div class="label">ZULU</div>
      <div class="time" id="utc"></div>
    </div>

    <div class="clock" data-timezone="America/New_York">
      <div class="label">NEW YORK</div>
      <div class="time" id="ny"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
